name: Build Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match package version" }
      - name: Core tests
        run: npm test
      - name: Build Windows portable executable
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Packaged desktop regression
        shell: pwsh
        run: |
          $env:SONORA_TEST_EXECUTABLE = (Resolve-Path release/win-unpacked/Sonora.exe).Path
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Desktop regression failed' }
          node tests/jerry-e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Jerry upgrade regression failed' }
          npm run test:collections
          if ($LASTEXITCODE -ne 0) { throw 'Collections regression failed' }
          npm run test:upgrade
          if ($LASTEXITCODE -ne 0) { throw 'Quality and recovery regression failed' }
          npm run test:account-playlists
          if ($LASTEXITCODE -ne 0) { throw 'Personal playlist regression failed' }
      - name: Generate SHA256
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath release -Filter 'Sonora-*-Windows-x64.exe' | ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" }
          $lines | Set-Content -LiteralPath release/SHA256.txt -Encoding utf8
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            $version = node -p "require('./package.json').version"
            $notes = "docs/release-$version.md"
            if (-not (Test-Path -LiteralPath $notes)) { $notes = 'CHANGELOG.md' }
            gh release create $env:GITHUB_REF_NAME --title "Sonora $env:GITHUB_REF_NAME" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $files = @(Get-ChildItem -LiteralPath release -Filter 'Sonora-*-Windows-x64.exe' | ForEach-Object FullName)
          $files += (Resolve-Path -LiteralPath release/SHA256.txt).Path
          gh release upload $env:GITHUB_REF_NAME @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - name: Upload optional manual build artifact
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Sonora-Windows-x64
          path: |
            release/Sonora-*-Windows-x64.exe
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
