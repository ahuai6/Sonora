name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:collections
      - run: npm run test:upgrade
      - run: npm run test:account-playlists
